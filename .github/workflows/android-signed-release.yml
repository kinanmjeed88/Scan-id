
name: Android signed release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-signed-release:
    name: Signed Android release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    environment: android-signing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Resolve dependencies
        shell: bash
        run: bash tool/bootstrap.sh

      - name: Check signing secret availability
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in \
            KEYSTORE_BASE64 \
            KEYSTORE_STORE_PASSWORD \
            KEYSTORE_KEY_ALIAS \
            KEYSTORE_KEY_PASSWORD
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing or empty secret: $name"
              exit 1
            fi

            echo "$name is present"
          done

      - name: Build signed Android release APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          REQUIRE_RELEASE_SIGNING: 'true'
        run: flutter build apk --release

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          apk='build/app/outputs/flutter-apk/app-release.apk'
          test -s "$apk"

          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK is not configured}}"
          apksigner="$(find "$sdk/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$apksigner"

          verification="$("$apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$verification"

          expected_sha256='55e92ed546ea405d736fdfdf0c99297f3a3c5b857455de63707f495e770dadb6'

          observed_sha256="$(
            printf '%s\n' "$verification" |
              awk -F': ' '/^Signer #1 certificate SHA-256 digest:/ {print $2; exit}' |
              tr -d ':' |
              tr '[:upper:]' '[:lower:]'
          )"

          if [[ "$observed_sha256" != "$expected_sha256" ]]; then
            echo 'APK signer certificate does not match the configured Android release key.' >&2
            exit 1
          fi

          echo 'APK signature verified and certificate fingerprint matched.'

      - name: Upload signed APK
        uses: actions/upload-artifact@v6
        with:
          name: scan-id-android-signed-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
