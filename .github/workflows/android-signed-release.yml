name: Android signed release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-signed-release:
    name: Signed Android release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Store the four KEYSTORE_* values as secrets in this protected environment.
    environment: android-signing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Resolve dependencies
        shell: bash
        run: bash tool/bootstrap.sh
      - name: Build signed Android release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          REQUIRE_RELEASE_SIGNING: 'true'
        run: flutter build apk --release
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk='build/app/outputs/flutter-apk/app-release.apk'
          test -s "$apk"
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK is not configured}}"
          apksigner="$(find "$sdk/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"
      - name: Upload signed APK
        uses: actions/upload-artifact@v6
        with:
          name: scan-id-android-signed-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
