name: Temporary audit formatter
on:
  push:
    branches: ['arena/4c4c6840-scan-id']
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/Mostmskat/
            !/local-data/
          sparse-checkout-cone-mode: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Format audit changes
        run: |
          dart format lib/application/contracts.dart lib/application/image_journey_report.dart lib/application/project_service.dart lib/application/smart_recognition.dart lib/domain/image_journey.dart lib/domain/project.dart lib/persistence/local_asset_repository.dart lib/persistence/local_image_editor.dart lib/presentation/intake.dart test/application/crop_lifecycle_test.dart test/application/journey_intake_test.dart test/integration/workflow_test.dart
          git diff > /tmp/audit-format.patch
          python3 -c 'import base64,gzip; s=base64.b64encode(gzip.compress(open("/tmp/audit-format.patch","rb").read())).decode(); [print(f"::notice title=audit-format-{i:03}::{s[i*3000:(i+1)*3000]}") for i in range((len(s)+2999)//3000)]' 
      - uses: actions/upload-artifact@v4
        with:
          name: audit-format-patch
          path: /tmp/audit-format.patch
          retention-days: 1
      - name: Restore the pinned DocAligner asset
        id: docaligner-cache
        # Caching is an optimisation: a cache outage must not fail verification.
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: assets/models/docaligner_fastvit_sa24_7f9f5a89.onnx
          key: docaligner-1.1.1-7f9f5a8935b2eb22b3ee0245d34996063f54562df390d34714af2d76928695bc

      - name: Prepare verified DocAligner 1.1.1 model asset
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4; do
            echo "Preparing pinned DocAligner asset (attempt $attempt/4)"
            if python tool/fetch_docaligner_model.py; then
              exit 0
            fi
            if (( attempt < 4 )); then
              sleep $((attempt * 10))
            fi
          done
          exit 1

      # The OCR graphs are 12.8 MiB of Apache-2.0 weights, git-ignored and
      # fetched from their pinned upstream revisions. The fetch verifies the byte
      # size and SHA-256 before the files are used, so a substituted or truncated
      # model cannot reach a build; a restored cache entry is re-hashed rather
      # than trusted.
      - name: Restore the pinned PP-OCRv5 models
        id: ocr-models-cache
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: |
            assets/models/ppocrv5_mobile_det.onnx
            assets/models/ppocrv5_arabic_mobile_rec.onnx
          key: ocr-models-ppocrv5-a431985659dc921974177a95adcfbb90fd9e51989a5e04d70d0b75f597b6e61d-799113ebf267fbe742deb99eb36e8d42c9ddc5291ceacf92add41b4d52a59110

      - name: Prepare verified PP-OCRv5 models
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            echo "Preparing pinned PP-OCRv5 models (attempt $attempt/4)"
            if python tool/fetch_ocr_models.py; then
              exit 0
            fi
            if (( attempt < 4 )); then
              sleep $((attempt * 10))
            fi
          done
          exit 1
      - name: Analyze and targeted regressions
        run: |
          flutter pub get
          python tool/ci_gate.py audit-analyze flutter analyze --fatal-infos
          python tool/ci_gate.py audit-tests flutter test test/persistence/journey_log_store_test.dart test/application/journey_intake_test.dart test/application/journey_report_audit_test.dart test/application/crop_lifecycle_test.dart test/integration/workflow_test.dart --reporter expanded
