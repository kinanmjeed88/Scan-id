name: Temporary audit formatter
on:
  push:
    branches: ['arena/4c4c6840-scan-id']
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Format audit changes
        run: |
          dart format lib/application/image_journey_report.dart lib/domain/image_journey.dart lib/domain/project.dart test/application/crop_lifecycle_test.dart test/application/image_journey_report_test.dart test/application/journey_report_audit_test.dart
          git diff > /tmp/audit-format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: audit-format-patch
          path: /tmp/audit-format.patch
          retention-days: 1
