name: Temporary reliability verification
on:
  push:
    branches: ['arena/4c4c6840-scan-id']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/Mostmskat/
            !/local-data/
          sparse-checkout-cone-mode: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Format diagnostic
        continue-on-error: true
        run: python tool/format_report.py
      - name: Restore pinned models
        uses: actions/cache/restore@v6
        with:
          path: |
            assets/models/docaligner_fastvit_sa24_7f9f5a89.onnx
          key: docaligner-1.1.1-7f9f5a8935b2eb22b3ee0245d34996063f54562df390d34714af2d76928695bc
      - name: Restore OCR models
        uses: actions/cache/restore@v6
        with:
          path: |
            assets/models/ppocrv5_mobile_det.onnx
            assets/models/ppocrv5_arabic_mobile_rec.onnx
          key: ocr-models-ppocrv5-a431985659dc921974177a95adcfbb90fd9e51989a5e04d70d0b75f597b6e61d-799113ebf267fbe742deb99eb36e8d42c9ddc5291ceacf92add41b4d52a59110
      - name: Fetch missing pinned models
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tool/fetch_docaligner_model.py
          python tool/fetch_ocr_models.py
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: python tool/ci_gate.py analyze flutter analyze --fatal-infos
      - name: Targeted tests
        run: python tool/ci_gate.py targeted flutter test test/application/journey_intake_test.dart test/persistence/journey_log_store_test.dart test/integration/revision_history_test.dart --reporter expanded
