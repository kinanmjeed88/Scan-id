name: Release Management (Dashboard)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "الإصدار الجديد (SemVer مثال 0.1.1 أو 1.0.0-rc.1)"
        required: true
        type: string
      build_number:
        description: "رقم البناء الجديد (عدد صحيح موجب)"
        required: true
        type: string
      release_notes:
        description: "ملاحظات الإصدار (3-5000 حرف)"
        required: true
        type: string
      targets:
        description: "الأنظمة المستهدفة"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - android
          - windows

permissions:
  contents: read

concurrency:
  group: release-management
  cancel-in-progress: false

jobs:
  validate:
    name: Validate request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      current_core: ${{ steps.current.outputs.core }}
      current_build: ${{ steps.current.outputs.build }}
      current_pubspec: ${{ steps.current.outputs.pubspec }}
      last_release: ${{ steps.current.outputs.last_release }}
      last_tag: ${{ steps.current.outputs.last_tag }}
      tag: ${{ steps.current.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Check actor permission
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          actor="${{ github.actor }}"
          repo="${{ github.repository }}"
          echo "Actor: $actor"
          # Must not silently allow on API failure — default to none and fail closed
          perm_raw=$(gh api "repos/$repo/collaborators/$actor/permission" --jq .permission 2>&1 || true)
          perm=$(echo "$perm_raw" | tr -d '[:space:]' | head -n1)
          if [[ -z "$perm" ]]; then perm="none"; fi
          echo "Permission: $perm"
          if [[ "$perm" != "admin" && "$perm" != "write" && "$perm" != "maintain" ]]; then
            echo "::error title=auth::المستخدم $actor ليس لديه صلاحية الكتابة (perm=$perm) — رُفض الطلب"
            exit 1
          fi
          echo "::notice title=auth::Actor $actor has $perm permission"

      - name: Check target branch
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ github.ref }}"
          echo "Ref: $ref"
          if [[ "$ref" != "refs/heads/searchidf" ]]; then
            echo "::error title=branch::الفرع المستهدف يجب أن يكون searchidf (الحالي $ref)"
            exit 1
          fi
          # Verify default branch is searchidf
          default=$(gh api repos/${{ github.repository }} --jq .default_branch)
          if [[ "$default" != "searchidf" ]]; then
            echo "::error title=branch::الفرع الافتراضي الحالي $default ليس searchidf"
            exit 1
          fi

      - name: Check no concurrent release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          count=$(gh api "repos/$repo/actions/workflows/release-management.yml/runs?status=in_progress&per_page=100" --jq '[.workflow_runs[] | select(.head_branch=="searchidf")] | length')
          # Subtract current run
          if [[ "$count" -gt 1 ]]; then
            echo "::error title=concurrency::يوجد عملية نشر جارية ($count)"
            gh api "repos/$repo/actions/runs/${{ github.run_id }}" --jq .html_url
            exit 1
          fi
          echo "No concurrent release"

      - name: Gather current state
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ver=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/"//g; s/'"'"'//g' | tr -d '[:space:]')
          core=$(echo "$ver" | cut -d'+' -f1)
          build=$(echo "$ver" | cut -d'+' -f2)
          if [[ -z "$build" ]]; then build="0"; fi
          echo "pubspec=$ver core=$core build=$build"
          echo "pubspec=$ver" >> "$GITHUB_OUTPUT"
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          # Last release
          last_release=""
          last_tag=""
          if rel=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name 2>/dev/null); then
            last_release="$rel"
          else
            echo "No previous release (404)"
          fi
          if tags=$(gh api repos/${{ github.repository }}/tags?per_page=1 --jq '.[0].name' 2>/dev/null); then
            last_tag="$tags"
          fi
          echo "last_release=$last_release" >> "$GITHUB_OUTPUT"
          echo "last_tag=$last_tag" >> "$GITHUB_OUTPUT"
          new="${{ inputs.version }}"
          tag="v$new"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Current: $ver core=$core build=$build last_release=$last_release last_tag=$last_tag new=$new tag=$tag"

      - name: Validate inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          new="${{ inputs.version }}"
          build="${{ inputs.build_number }}"
          notes="${{ inputs.release_notes }}"
          targets="${{ inputs.targets }}"
          current_core="${{ steps.current.outputs.core }}"
          current_build="${{ steps.current.outputs.build }}"
          last_release="${{ steps.current.outputs.last_release }}"
          tag="v$new"

          # SemVer strict
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          semver_core='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if ! [[ "$new" =~ $semver_core ]]; then
            echo "::error title=validation::صيغة الإصدار غير صالحة: $new (يجب X.Y.Z أو X.Y.Z-prerelease)"
            exit 1
          fi
          # Check prerelease numeric zeros
          if [[ "$new" =~ -.*\.0[0-9] ]]; then
            echo "::warning::تحقق من prerelease zeros"
          fi

          # Use Dart compare logic via Python for SemVer
          python3 <<PY
          import re, sys
          def parse(v):
              m=re.match(r'^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$', v)
              if not m: return None
              pr=m.group(4).split('.') if m.group(4) else []
              for id in pr:
                  if re.match(r'^[0-9]+$', id) and len(id)>1 and id.startswith('0'):
                      return None
              return m
          def cmp(a,b):
              pa, pb = parse(a), parse(b)
              if not pa or not pb: sys.exit(1)
              for i in [1,2,3]:
                  ai, bi = int(pa.group(i)), int(pb.group(i))
                  if ai!=bi: return 1 if ai>bi else -1
              pra=pa.group(4).split('.') if pa.group(4) else []
              prb=pb.group(4).split('.') if pb.group(4) else []
              if not pra and not prb: return 0
              if not pra: return 1
              if not prb: return -1
              for x,y in zip(pra,prb):
                  nx, ny = x.isdigit(), y.isdigit()
                  if nx and ny:
                      if len(x)!=len(y): return 1 if len(x)>len(y) else -1
                      if x!=y: return 1 if x>y else -1
                  elif nx!=ny:
                      return -1 if nx else 1
                  else:
                      if x!=y: return 1 if x>y else -1
              return len(pra)-len(prb)
          current="$current_core"
          new_v="$new"
          if cmp(new_v, current) <=0:
              print(f"::error title=validation::الإصدار الجديد {new_v} ليس أحدث من الحالي {current}")
              sys.exit(1)
          last_rel="$last_release"
          if last_rel:
              last_ver=last_rel[1:] if last_rel.startswith('v') else last_rel
              # handle release- prefix
              if last_ver.startswith('release-'): last_ver=last_ver[len('release-'):]
              # strip build metadata
              last_ver=last_ver.split('+')[0]
              if cmp(new_v, last_ver) <=0:
                  print(f"::error title=validation::الإصدار الجديد {new_v} ليس أحدث من آخر Release {last_rel}")
                  sys.exit(1)
          PY
          # Check duplicate tag
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q "$tag"; then
            echo "::error title=validation::Tag $tag موجود مسبقاً"
            exit 1
          fi
          if gh api repos/${{ github.repository }}/releases/tags/$tag --jq .tag_name 2>/dev/null | grep -q "$tag"; then
            echo "::error title=validation::Release $tag موجود مسبقاً"
            exit 1
          fi

          # Build number
          if ! [[ "$build" =~ ^[0-9]+$ ]] || [[ "$build" -lt 1 ]]; then
            echo "::error title=validation::رقم البناء يجب أن يكون عدداً موجباً: $build"
            exit 1
          fi
          if [[ "$new" == "$current_core" && "$build" -le "$current_build" ]]; then
            echo "::error title=validation::رقم البناء $build يجب أن يكون أكبر من الحالي $current_build لنفس Core"
            exit 1
          fi

          # Release notes
          len=${#notes}
          if [[ $len -lt 3 ]]; then echo "::error::ملاحظات قصيرة جداً"; exit 1; fi
          if [[ $len -gt 5000 ]]; then echo "::error::ملاحظات طويلة جداً"; exit 1; fi

          # Branch mismatch check: code vs last release
          if [[ -n "$last_release" ]]; then
            last_core=$(echo "$last_release" | sed -E 's/^v//; s/^release-//; s/\+.*//')
            if [[ "$last_core" != "$current_core" ]]; then
              echo "::warning title=validation::اختلاف: كود $current_core vs آخر Release $last_core — سيتم توحيدهما بالـ workflow"
            fi
          fi

          echo "::notice title=validation::Validated version=$new build=$build targets=$targets"
          echo "## ملخص الإصدار" >> "$GITHUB_STEP_SUMMARY"
          echo "- الحالي: $current_core+$current_build" >> "$GITHUB_STEP_SUMMARY"
          echo "- المقترح: $new+$build" >> "$GITHUB_STEP_SUMMARY"
          echo "- ملاحظات: $notes" >> "$GITHUB_STEP_SUMMARY"
          echo "- الأنظمة: $targets" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: $tag" >> "$GITHUB_STEP_SUMMARY"

  update-version:
    name: Update version files
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      new_build: ${{ steps.bump.outputs.new_build }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ github.token }}

      - name: Update the two version files
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          new="${{ inputs.version }}"
          build="${{ inputs.build_number }}"
          new_pubspec="${new}+${build}"
          tag="v${new}"
          echo "Updating to $new_pubspec tag $tag"

          # pubspec.yaml
          sed -i -E "s/^version:.*/version: $new_pubspec/" pubspec.yaml
          grep -q "^version: $new_pubspec" pubspec.yaml || { echo "::error::pubspec update failed"; exit 1; }

          # The version a build carries lives in exactly one Dart file. The About
          # dialog and the update check both read that constant, so a published
          # version cannot leave one of them comparing itself to a stale number.
          version_file=lib/application/app_release.dart
          grep -q "const String appVersion = '" "$version_file" || { echo "::error::$version_file no longer carries the appVersion line this step edits"; exit 1; }
          sed -i -E "s/const String appVersion = '[^']*'/const String appVersion = '$new'/" "$version_file"
          grep -q "const String appVersion = '$new'" "$version_file" || { echo "::error::version file update failed"; exit 1; }

          # Verify scope: only the two version files may change
          changed=$(git diff --name-only)
          echo "Changed files:"
          echo "$changed"
          allowed="pubspec.yaml
          lib/application/app_release.dart"
          for f in $changed; do
            if ! echo "$allowed" | grep -qx "$f"; then
              echo "::error::تغيير غير متوقع في $f — المسموح pubspec.yaml وlib/application/app_release.dart فقط"
              git diff --stat
              exit 1
            fi
          done

          echo "new_version=$new" >> "$GITHUB_OUTPUT"
          echo "new_build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # Stash for next jobs (we will re-apply via artifact or keep in workspace)
          # Instead of committing now, we keep modified files and upload as artifact for build jobs
          mkdir -p /tmp/version-bump
          cp pubspec.yaml /tmp/version-bump/
          cp lib/application/app_release.dart /tmp/version-bump/app_release.dart.bak

      - name: Upload version bump artifact
        uses: actions/upload-artifact@v6
        with:
          name: version-bump
          path: /tmp/version-bump
          retention-days: 7

  build:
    name: Build and verify
    needs: [validate, update-version]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: android-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore version bump
        uses: actions/download-artifact@v6
        with:
          name: version-bump
          path: /tmp/version-bump

      - name: Apply version bump
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/version-bump/pubspec.yaml pubspec.yaml
          cp /tmp/version-bump/app_release.dart.bak lib/application/app_release.dart
          grep -E '^version:' pubspec.yaml
          grep -E 'appVersion' lib/application/app_release.dart

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Install Gradle fallback
        shell: bash
        run: bash tool/install_gradle_init.sh
      - name: Restore Gradle caches
        id: gradle-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Resolve dependencies
        shell: bash
        run: python tool/ci_gate.py bootstrap bash tool/bootstrap.sh
      - name: Source audit
        run: python tool/ci_gate.py source-audit python tool/check_source.py
      - name: Dart format gate
        run: python tool/ci_gate.py format dart format --output=none --set-exit-if-changed .
      - name: Flutter analyze
        run: python tool/ci_gate.py analyze flutter analyze --fatal-infos
      - name: Flutter tests
        run: python tool/ci_gate.py test flutter test --reporter expanded

      - name: Build Android debug (smoke)
        run: python tool/ci_gate.py android-build flutter build apk --debug

      - name: Build Android release (if android target)
        if: contains(inputs.targets, 'android') || inputs.targets == 'both'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          REQUIRE_RELEASE_SIGNING: true
        shell: bash
        run: |
          set -euo pipefail
          # Re-check secrets presence (names only)
          missing=()
          [[ -n "${KEYSTORE_BASE64:-}" ]] || missing+=("KEYSTORE_BASE64")
          [[ -n "${KEYSTORE_STORE_PASSWORD:-}" ]] || missing+=("KEYSTORE_STORE_PASSWORD")
          [[ -n "${KEYSTORE_KEY_ALIAS:-}" ]] || missing+=("KEYSTORE_KEY_ALIAS")
          [[ -n "${KEYSTORE_KEY_PASSWORD:-}" ]] || missing+=("KEYSTORE_KEY_PASSWORD")
          if (( ${#missing[@]} >0 )); then
            echo "::error::Missing signing secrets: ${missing[*]}"
            exit 1
          fi
          python tool/ci_gate.py android-release flutter build apk --release

      - name: Verify APK signature
        if: contains(inputs.targets, 'android') || inputs.targets == 'both'
        shell: bash
        env:
          EXPECTED_CERT_SHA256: '3e9c3d988ab491a60a570b4c70de79c1eba61f038893d3cd2a4ea29bb913c74a'
        run: |
          set -euo pipefail
          apk='build/app/outputs/flutter-apk/app-release.apk'
          test -s "$apk" || { echo "::error title=signing-verify::Release APK missing or empty: $apk" >&2; exit 1; }
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK is not configured}}"
          apksigner="$(find "$sdk/build-tools" -type f -name apksigner -print | sort -V | tail -n1)"
          test -n "$apksigner" || { echo "::error title=signing-verify::apksigner not found in Android SDK build-tools" >&2; exit 1; }
          report="/tmp/apksigner-verify.txt"
          rc=0
          "$apksigner" verify --verbose --print-certs "$apk" > "$report" 2>&1 || rc=$?
          cat "$report"
          if (( rc != 0 )); then echo "::error title=signing-verify::apksigner verify exited $rc; signature could not be verified" >&2; exit 1; fi
          # Filter to certificate digest only (not public key), handle both V2/V4 label variants
          digest_line="$( { grep -iE 'certificate.*sha-256 digest' "$report" || true; } | { grep -iv 'public key' || true; } | head -n 1 || true)"
          if [[ -z "$digest_line" ]]; then digest_line="$( { grep -iE 'sha-256 digest' "$report" || true; } | { grep -iv 'public key' || true; } | head -n 1 || true)"; fi
          observed="$(printf '%s' "$digest_line" | sed -E 's/.*digest:[[:space:]]*//I' | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$observed" =~ ^[0-9a-f]{64}$ ]]; then echo "::error title=signing-verify::could not read signer certificate SHA-256 (parsed ${#observed} chars)" >&2; exit 1; fi
          # Reject multi-signer APKs (ambiguous fingerprint)
          signers="$(grep -i -m1 'number of signers' "$report" | sed -E 's/.*:[[:space:]]*//' | tr -d '[:space:]' || true)"
          if [[ "$signers" =~ ^[0-9]+$ ]] && (( signers != 1 )); then echo "::error title=signing-verify::APK reports $signers signers; exactly one expected" >&2; exit 1; fi
          # Ensure release build is not debuggable
          aapt2="$(find "$sdk/build-tools" -type f -name aapt2 -print | sort -V | tail -n 1)"
          test -n "$aapt2" || { echo "::error title=signing-verify::aapt2 not found" >&2; exit 1; }
          "$aapt2" dump badging "$apk" > /tmp/apk-badging.txt 2>&1 || true
          if ! grep -q '^package:' /tmp/apk-badging.txt; then echo "::error title=signing-verify::aapt2 could not read manifest" >&2; head -c 400 /tmp/apk-badging.txt >&2; exit 1; fi
          if grep -q 'application-debuggable' /tmp/apk-badging.txt; then echo "::error title=signing-verify::Release APK reports android:debuggable — release signing misconfigured" >&2; exit 1; fi
          if [[ "$observed" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error title=signing-verify::APK cert $observed != expected $EXPECTED_CERT_SHA256" >&2
            if grep -qi 'CN=Android Debug' "$report"; then echo "::error title=signing-verify::APK signed with AOSP debug key" >&2; fi
            exit 1
          fi
          echo "APK verified: $observed (debuggable=false, signers=$signers)"

      - name: Upload APK artifact
        if: contains(inputs.targets, 'android') || inputs.targets == 'both'
        uses: actions/upload-artifact@v6
        with:
          name: scan-id-android-signed-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Save Gradle caches
        if: success()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}

  windows:
    name: Windows build
    needs: [validate, update-version]
    if: contains(inputs.targets, 'windows') || inputs.targets == 'both'
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore version bump
        uses: actions/download-artifact@v6
        with:
          name: version-bump
          path: /tmp/version-bump
      - name: Apply version bump
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/version-bump/pubspec.yaml pubspec.yaml
          cp /tmp/version-bump/app_release.dart.bak lib/application/app_release.dart
          echo "Applied version bump:"
          grep -E '^version:' pubspec.yaml
          grep -E 'appVersion' lib/application/app_release.dart
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Resolve dependencies
        shell: bash
        run: python tool/ci_gate.py bootstrap bash tool/bootstrap.sh
      - name: Build Windows release
        run: python tool/ci_gate.py windows-build flutter build windows --release
      - name: Build native Windows scaler regression tests
        run: python tool/ci_gate.py windows-scaler-build cmake --build build/windows/x64 --config Release --target large_jpeg_scaler_test
      - name: Run native Windows scaler regressions
        run: python tool/ci_gate.py windows-scaler-test ctest --test-dir build/windows/x64 -C Release --output-on-failure -R large_jpeg_scaler_windows
      - name: Create Windows portable ZIP
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          $zip = "scan-id-windows.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Get-ChildItem $src -Recurse | Out-Null
          Compress-Archive -Path "$src/*" -DestinationPath $zip -Force
          $size = (Get-Item $zip).Length
          Write-Host "Created $zip ($size bytes)"
          if ($size -eq 0) { throw "Windows ZIP is empty" }
          # Verify ZIP contains scan_id executable and is not just tests
          $entries = (Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP/zip-check -Force -PassThru; Get-ChildItem $env:RUNNER_TEMP/zip-check -Recurse | Select-Object -ExpandProperty Name)
          if (-not (Test-Path "$env:RUNNER_TEMP/zip-check/scan_id.exe")) { throw "ZIP missing scan_id.exe" }
          Remove-Item $env:RUNNER_TEMP/zip-check -Recurse -Force
      - name: Windows application
        uses: actions/upload-artifact@v6
        with:
          name: scan-id-windows
          path: |
            build/windows/x64/runner/Release/
            !build/windows/x64/runner/Release/large_jpeg_scaler_test.exe
            !build/windows/x64/runner/Release/large_jpeg_scaler_test.pdb
          retention-days: 14
          if-no-files-found: error
      - name: Windows portable ZIP
        uses: actions/upload-artifact@v6
        with:
          name: scan-id-windows-zip
          path: scan-id-windows.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish Release
    needs: [validate, update-version, build, windows]
    if: ${{ always() && needs.validate.result == 'success' && needs.update-version.result == 'success' && needs.build.result == 'success' && (needs.windows.result == 'success' || needs.windows.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: publish-release-management
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Restore version bump
        uses: actions/download-artifact@v6
        with:
          name: version-bump
          path: /tmp/version-bump

      - name: Apply version bump
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/version-bump/pubspec.yaml pubspec.yaml
          cp /tmp/version-bump/app_release.dart.bak lib/application/app_release.dart
          grep -E '^version:' pubspec.yaml
          grep -E "const String appVersion = '" lib/application/app_release.dart

      - name: Download Android APK
        if: contains(inputs.targets, 'android') || inputs.targets == 'both'
        uses: actions/download-artifact@v6
        with:
          name: scan-id-android-signed-apk
          path: release-assets/android

      - name: Download Windows ZIP
        if: contains(inputs.targets, 'windows') || inputs.targets == 'both'
        uses: actions/download-artifact@v6
        with:
          name: scan-id-windows-zip
          path: release-assets/windows

      - name: Verify assets before publish
        shell: bash
        run: |
          set -euo pipefail
          # 1. Version consistency: artifact must match requested inputs.version
          ver=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/"//g; s/'\''//g' | tr -d '[:space:]')
          core=$(echo "$ver" | cut -d'+' -f1)
          build=$(echo "$ver" | cut -d'+' -f2)
          if [[ "$core" != "${{ inputs.version }}" ]]; then echo "::error title=release-verify::pubspec core $core != requested ${{ inputs.version }} — artifact mismatch"; exit 1; fi
          if [[ "$build" != "${{ inputs.build_number }}" ]]; then echo "::error title=release-verify::pubspec build $build != requested ${{ inputs.build_number }}"; exit 1; fi
          echo "Version artifact verified: $ver"
          # 2. APK checks (when target includes android)
          if [[ "${{ inputs.targets }}" == "both" || "${{ inputs.targets }}" == "android" ]]; then
            apk="release-assets/android/app-release.apk"
            test -s "$apk" || { echo "::error::APK missing"; exit 1; }
            echo "APK $(stat -c%s "$apk") bytes SHA256=$(sha256sum "$apk" | awk '{print $1}')"
            # Ensure APK was the signed one from build job (already verified there, but double-check size)
            if [[ $(stat -c%s "$apk") -lt 1000000 ]]; then echo "::error::APK suspiciously small"; exit 1; fi
          fi
          if [[ "${{ inputs.targets }}" == "both" || "${{ inputs.targets }}" == "windows" ]]; then
            zip="release-assets/windows/scan-id-windows.zip"
            test -s "$zip" || { echo "::error::ZIP missing"; exit 1; }
            echo "ZIP $(stat -c%s "$zip") bytes SHA256=$(sha256sum "$zip" | awk '{print $1}')"
            unzip -l "$zip" >/dev/null || { echo "::error::ZIP invalid"; exit 1; }
            # Windows ZIP must contain main executable
            if ! unzip -l "$zip" | grep -qi 'scan_id\.exe'; then echo "::error::ZIP missing scan_id.exe"; unzip -l "$zip" | head -n 20; exit 1; fi
            if [[ $(stat -c%s "$zip") -lt 5000000 ]]; then echo "::warning::ZIP suspiciously small — verify windows build completeness"; fi
          fi
          # Generate hashes with deterministic ordering
          mkdir -p release-ready
          if [[ -f "release-assets/android/app-release.apk" ]]; then cp "release-assets/android/app-release.apk" "release-ready/scan-id-android-${{ inputs.version }}.apk"; fi
          if [[ -f "release-assets/windows/scan-id-windows.zip" ]]; then cp "release-assets/windows/scan-id-windows.zip" "release-ready/scan-id-windows-${{ inputs.version }}.zip"; fi
          (cd release-ready && sha256sum -- *.apk *.zip 2>/dev/null | sort > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # Save local hashes for post-publish digest comparison
          cp release-ready/SHA256SUMS.txt /tmp/local-hashes.txt
          echo "Local hashes saved for OTA digest verification"

      - name: Commit version bump and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          new="${{ inputs.version }}"
          build="${{ inputs.build_number }}"
          tag="v$new"
          # Configure git
          git config user.name "Scan-id Release"
          git config user.email "actions@github.com"
          # Commit
          git add pubspec.yaml lib/presentation/app.dart lib/presentation/settings_screen.dart
          if git diff --cached --quiet; then
            echo "::warning::No changes to commit (version may be same)"
          else
            git commit -m "release: $tag+$build

          $tag build $build
          ${{ inputs.release_notes }}"
            git push origin HEAD:searchidf
          fi
          # Tag
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q "$tag"; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

      - name: Create Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ inputs.version }}"
          notes="${{ inputs.release_notes }}"
          # Escape notes for GitHub
          gh release create "$tag" --repo "${{ github.repository }}" --title "Scan-id $tag" --notes "$notes" --target searchidf release-ready/*

      - name: Verify OTA assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ inputs.version }}"
          # Wait briefly for digest propagation (GitHub generates digest async for large assets)
          sleep 5
          json=$(gh release view "$tag" --repo "${{ github.repository }}" --json assets --jq '.assets')
          echo "$json" | jq .
          # Platform-correct files
          if [[ "${{ inputs.targets }}" == "both" || "${{ inputs.targets }}" == "android" ]]; then
            if ! echo "$json" | jq -e '.[] | select(.name == "scan-id-android-${{ inputs.version }}.apk")' >/dev/null; then echo "::error::No APK with expected name scan-id-android-${{ inputs.version }}.apk"; exit 1; fi
          fi
          if [[ "${{ inputs.targets }}" == "both" || "${{ inputs.targets }}" == "windows" ]]; then
            if ! echo "$json" | jq -e '.[] | select(.name == "scan-id-windows-${{ inputs.version }}.zip")' >/dev/null; then echo "::error::No ZIP with expected name scan-id-windows-${{ inputs.version }}.zip"; exit 1; fi
          fi
          # Must have SHA256SUMS for manual verification
          if ! echo "$json" | jq -e '.[] | select(.name == "SHA256SUMS.txt")' >/dev/null; then echo "::error::No SHA256SUMS.txt asset"; exit 1; fi
          # Digest must not be null (OTA requires it)
          missing=$(echo "$json" | jq '[.[] | select(.digest==null or .digest=="")] | length')
          if [[ "$missing" -gt 0 ]]; then
            echo "::warning::Some assets missing digest: $missing — OTA will reject until GitHub generates sha256"
            echo "$json" | jq -c '.[] | {name, digest}'
          fi
          # Compare local hashes vs remote digests (digest=sha256:<hex>)
          echo "Comparing local vs remote digests..."
          while read -r hash fname; do
            # Find matching remote asset by name
            remote_digest=$(echo "$json" | jq -r --arg n "$fname" '.[] | select(.name==$n) | .digest // empty')
            if [[ -z "$remote_digest" ]]; then echo "::warning::No remote digest for $fname"; continue; fi
            remote_hash=$(echo "$remote_digest" | sed -E 's/^sha256://I')
            if [[ "$remote_hash" != "$hash" ]]; then
              echo "::error::Hash mismatch for $fname: local $hash != remote $remote_hash"
              exit 1
            fi
            echo "✓ $fname digest matches: $hash"
          done < /tmp/local-hashes.txt
          echo "::notice::OTA verified for $tag — all digests match local hashes"
          echo "## Release Published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: $tag" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pubspec: $(cat pubspec.yaml | grep version)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Assets: $(echo "$json" | jq -r '.[].name' | tr '\n' ' ') " >> "$GITHUB_STEP_SUMMARY"
          echo "- Digests: $(echo "$json" | jq -c '[.[] | {name, digest}]')" >> "$GITHUB_STEP_SUMMARY"
