name: Scan ID verification
on:
  pull_request:
  push:
    branches: [searchidf, 'arena/**']
  workflow_dispatch:
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: 1
permissions:
  # Verification is read-only. It must never commit or push from CI.
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Quality gate (format, analyze, tests, independent export audit) followed
  # by a clearly labelled Android debug smoke artifact. Release APKs are built only
  # by the protected, signed-release workflow.
  android:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 50
    steps:
      # Mostmskat/ contains private, local-only evaluation data. Sparse partial
      # checkout keeps those blobs out of every GitHub Actions runner.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/Mostmskat/
            !/local-data/
          sparse-checkout-cone-mode: false
      - name: Assert local-only evaluation data is excluded
        shell: bash
        run: |
          set -euo pipefail
          test ! -e Mostmskat
          test ! -e local-data
          python tool/check_private_ci_checkout.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tool/requirements-annotation-test.txt
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      # Both Gradle invocations below (the release guard and the debug build) start
      # an included Flutter tools build that declares no plugin repositories of its
      # own; run 38815652328 showed what that costs when plugins.gradle.org cannot
      # serve the Kotlin artifacts it proxies from Maven Central. See
      # tool/gradle/plugin-repositories.init.gradle.
      - name: Prepare verified DocAligner 1.1.1 model asset
        run: python tool/fetch_docaligner_model.py

      - name: Install Gradle plugin-repository fallback
        shell: bash
        run: bash tool/install_gradle_init.sh

      # Gradle re-downloads the same plugins on every run; restoring them keeps the
      # gate independent of any single repository. A cache miss or an outage of the
      # cache service only makes the run slower.
      - name: Restore cached Gradle artifacts
        id: gradle-cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Report Gradle cache state
        id: gradle-cache-state
        shell: bash
        run: |
          set -euo pipefail
          gradle_user_home="${GRADLE_USER_HOME:-$HOME/.gradle}"
          cold=0
          lines=()
          for path in "$gradle_user_home/caches/modules-2" "$gradle_user_home/wrapper/dists"; do
            if [[ -d "$path" ]]; then
              lines+=("restored: $path ($(du -sh "$path" | cut -f1))")
            else
              lines+=("missing: $path (this run will download it)")
              cold=1
            fi
          done
          {
            echo "== Gradle caches before the build =="
            printf '%s\n' "${lines[@]}"
          } | tee diagnostics/gradle-cache.txt
          echo "cold=$cold" >> "$GITHUB_OUTPUT"

      - name: Resolve dependencies
        shell: bash
        run: python tool/ci_gate.py bootstrap bash tool/bootstrap.sh
      - name: Source integrity audit
        run: python tool/ci_gate.py source-audit python tool/check_source.py
      - name: Audit workflow permissions and write paths
        run: python tool/check_workflow_permissions.py
      - name: Detector retirement and manual-only contract
        run: python tool/check_detector_retirement.py
      - name: Install local annotation test dependencies
        run: python -m pip install --requirement tool/requirements-annotation-test.txt
      - name: Local policy and annotation-tool tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest test.tool.branch_cleanup_test test.tool.test_local_annotation_validator test.tool.test_format_report --verbose
          script=$(mktemp --suffix=.js)
          python - "$script" <<'PY'
          import pathlib
          import sys
          source = pathlib.Path('tool/local_annotation_studio.html').read_text(encoding='utf-8')
          script = source.split('<script>', 1)[1].split('</script>', 1)[0]
          pathlib.Path(sys.argv[1]).write_text(script, encoding='utf-8')
          PY
          node --check "$script"
          rm -f "$script"
      - name: Dart format gate
        run: python tool/ci_gate.py format python tool/format_report.py
      - name: Flutter analyze
        run: python tool/ci_gate.py analyze flutter analyze --fatal-infos
      - name: Flutter tests
        run: python tool/ci_gate.py test flutter test --reporter expanded
      # The build below MUST fail, and only the signing guard may be the reason.
      # A repository outage must not read as "the release build no longer
      # enforces signing" (that is what a red gate on a good revision looks
      # like), so a failure inside plugin/dependency resolution -- and only such
      # a failure -- is retried once before it is reported.
      - name: Ensure release build rejects missing signing credentials
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p diagnostics
          # The reason has to survive without the Actions log store: annotations
          # are the only channel API-only clients can read, so the tail of the
          # captured output is re-emitted (percent signs escaped, lines joined
          # with '~' to stay on one annotation line).
          annotate() {
            local title="$1" bytes="$2" detail
            detail="$(tail -c "$bytes" "$log" | sed -e 's/%/%25/g' -e 's/\r//g' | tr '\n' '~')"
            printf '::error title=%s::%s\n' "$title" "$detail" >&2
          }
          guard_message() {
            grep -Fq 'Release signing is required, but Android signing values are missing.' "$log" ||
              grep -Fq 'Release APK/AAB packaging requires a configured release keystore.' "$log"
          }
          transient='Could not find|Could not resolve|Could not GET|Could not HEAD|Could not download|Searched in the following locations|Connection (refused|reset|timed out)|Read timed out|Remote host terminated'
          for attempt in 1 2; do
            log="diagnostics/signing-guard-attempt-$attempt.log"
            rc=0
            flutter build apk --flavor scanid --release > "$log" 2>&1 || rc=$?
            cat "$log"
            if (( rc == 0 )); then
              annotate signing-guard-unexpected-success 1200
              echo 'Release build unexpectedly succeeded without release signing credentials.' >&2
              exit 1
            fi
            if guard_message; then
              cp -f "$log" diagnostics/signing-guard.log
              echo "::notice title=signing-guard::attempt $attempt of 2 failed with the signing guard message, as required"
              exit 0
            fi
            if (( attempt == 1 )) && grep -qE "$transient" "$log"; then
              echo "::warning title=signing-guard::attempt 1 failed inside plugin/dependency resolution, not on the signing guard; retrying once" >&2
              continue
            fi
            break
          done
          annotate signing-guard-reason 2600
          echo 'Release build failed for an unrelated reason; signing guard was not confirmed.' >&2
          exit 1
      - name: Export audit dependencies
        run: python -m pip install PyMuPDF==1.26.5 Pillow==11.3.0
      - name: Independently validate exported documents
        run: python tool/ci_gate.py export-audit python tool/verify_exports.py
      - name: Build Android debug APK (CI smoke test)
        run: python tool/ci_gate.py android-build flutter build apk --flavor scanid --debug
      - name: Build independent offline annotation flavor
        run: python tool/ci_gate.py annotator-build flutter build apk --flavor annotator --debug --target lib/reference_annotation/main.dart
      - name: Audit merged annotation-flavor permissions
        shell: bash
        run: |
          set -euo pipefail
          manifest=$(find build/app/intermediates/merged_manifest -type f -path '*annotatorDebug*' -name AndroidManifest.xml -print -quit)
          test -n "$manifest"
          python tool/check_annotator_manifest.py "$manifest"
      - name: Upload offline annotator debug APK (CI smoke artifact)
        uses: actions/upload-artifact@v6
        with:
          name: scan-id-reference-annotator-debug-apk
          path: build/app/outputs/flutter-apk/app-annotator-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Check Android Emulator acceleration
        id: emulator-acceleration
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 0666 /dev/kvm
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=android-emulator::/dev/kvm is available; hardware acceleration enabled"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=android-emulator::/dev/kvm is unavailable; the emulator will use software acceleration"
          fi

      - name: Android native instrumentation (BitmapRegionDecoder)
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-linux-hw-accel: ${{ steps.emulator-acceleration.outputs.available != 'true' }}
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none
          script: bash tool/run_android_instrumentation.sh

      - name: Upload Android instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: scan-id-android-crop-instrumentation
          path: |
            diagnostics/android-instrumentation/
            build/app/reports/androidTests/connected/
            build/app/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 7

      # Guards the release workflow's fingerprint parser against a change in the
      # signing tool's report layout: build-tools 37 labels the signer
      # certificate digest "V2 Signer: ..." where earlier versions printed
      # "Signer #1 certificate SHA-256 digest:" -- a mismatch that silently made
      # the release workflow compare an empty digest. Runs a real APK through the
      # exact parsing chain; prints no secret material, only how a CI debug key's
      # certificate is reported.
      - name: Prove apksigner certificate reporting format (diagnostic)
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?Android SDK is not configured}}"
          apksigner="$(find "$sdk/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" version || true
          apk=build/app/outputs/flutter-apk/app-scanid-debug.apk
          "$apksigner" verify --verbose --print-certs "$apk" > /tmp/diag-out.txt 2> /tmp/diag-err.txt || true
          out_lines="$(wc -l < /tmp/diag-out.txt | tr -d ' ')"
          err_lines="$(wc -l < /tmp/diag-err.txt | tr -d ' ')"
          # Same chain as the release workflow, character for character.
          digest_line="$( { grep -iE 'certificate.*sha-256 digest' /tmp/diag-out.txt || true; } | { grep -iv 'public key' || true; } | head -n 1 || true)"
          if [[ -z "$digest_line" ]]; then
            digest_line="$( { grep -iE 'sha-256 digest' /tmp/diag-out.txt || true; } | { grep -iv 'public key' || true; } | head -n 1 || true)"
          fi
          digest="$(printf '%s' "$digest_line" | sed -E 's/.*digest:[[:space:]]*//I' | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          # Long hex is masked: the notice carries the layout, not the digests.
          layout="$(sed -E 's/[0-9a-fA-F]{16,}/<hex>/g' /tmp/diag-out.txt | head -n 20 | paste -sd '|' -)"
          echo "parsed_sha256_chars=${#digest}"
          echo "layout=$layout"
          if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error title=apksigner-report::the certificate digest parser read ${#digest} characters, not a 64-character SHA-256. Layout: $layout" >&2
            exit 1
          fi
          echo "::notice title=apksigner-report format::tool=$apksigner stdout_lines=$out_lines stderr_lines=$err_lines parsed_sha256_chars=${#digest} layout=$layout"

      # Reports, with annotations, which builds in the Gradle tree resolved plugins
      # with the fallback repositories installed. Warning-only evidence: the gate
      # itself is the build steps above.
      - name: Report Gradle plugin-repository coverage
        if: always()
        shell: bash
        run: bash tool/report_gradle_plugin_repositories.sh diagnostics/*.log

      # Only a run that had to download something refreshes the cache; a full hit
      # must not spend minutes re-uploading what is already stored.
      - name: Save Gradle caches
        if: success() && steps.gradle-cache-state.outputs.cold == '1'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}

      - name: Android debug APK
        uses: actions/upload-artifact@v6
        with:
          name: scan-id-android-debug-apk
          path: build/app/outputs/flutter-apk/app-scanid-debug.apk
          if-no-files-found: error
          # CI smoke artifact only; short retention prevents artifact-storage
          # quota exhaustion (430 artifacts / 5.5 GB hit the quota in Oct 2026).
          retention-days: 7

  # Share the exact Windows build and regression checks with the signed release.
  windows:
    uses: ./.github/workflows/windows-release.yml
    permissions:
      contents: read
