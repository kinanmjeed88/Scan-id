name: Scan ID verification
on:
  pull_request:
  push:
    branches: [searchidf, 'arena/**']
  workflow_dispatch:
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: 1
permissions:
  # Write access exists only so a commit marked [format] can receive the real
  # `dart format` output on its own branch; nothing else pushes.
  contents: write
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Quality gate (format, analyze, tests, independent export audit) followed
  # by a clearly labelled Android debug smoke artifact. Release APKs are built only
  # by the protected, signed-release workflow.
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Resolve dependencies
        shell: bash
        run: python tool/ci_gate.py bootstrap bash tool/bootstrap.sh
      - name: Source integrity audit
        run: python tool/ci_gate.py source-audit python tool/check_source.py
      - name: Report formatter differences
        env:
          SCAN_ID_FORMAT_COMMIT: ${{ contains(github.event.head_commit.message, '[format]') && '1' || '0' }}
        run: python tool/format_report.py
      - name: Dart format gate
        run: python tool/ci_gate.py format dart format --output=none --set-exit-if-changed .
      - name: Flutter analyze
        run: python tool/ci_gate.py analyze flutter analyze --fatal-infos
      - name: Flutter tests
        run: python tool/ci_gate.py test flutter test --reporter expanded
      - name: Ensure release build rejects missing signing credentials
        shell: bash
        run: |
          set -euo pipefail
          if release_output="$(flutter build apk --release 2>&1)"; then
            echo 'Release build unexpectedly succeeded without release signing credentials.' >&2
            exit 1
          fi
          printf '%s\n' "$release_output"
          if ! grep -Fq 'Release signing is required, but Android signing values are missing.' <<< "$release_output" &&
             ! grep -Fq 'Release APK/AAB packaging requires a configured release keystore.' <<< "$release_output"; then
            echo 'Release build failed for an unrelated reason; signing guard was not confirmed.' >&2
            exit 1
          fi
      - name: Export audit dependencies
        run: python -m pip install PyMuPDF==1.26.5 Pillow==11.3.0
      - name: Independently validate exported documents
        run: python tool/ci_gate.py export-audit python tool/verify_exports.py
      - name: Build Android debug APK (CI smoke test)
        run: python tool/ci_gate.py android-build flutter build apk --debug
      - name: Android debug APK
        uses: actions/upload-artifact@v6
        with:
          name: scan-id-android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  # The Windows deliverable: the self-contained release folder, published as
  # one downloadable archive.
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Resolve dependencies
        shell: bash
        run: python tool/ci_gate.py bootstrap bash tool/bootstrap.sh
      - name: Build Windows release
        run: python tool/ci_gate.py windows-build flutter build windows --release
      - name: Build native Windows scaler regression tests
        run: python tool/ci_gate.py windows-scaler-build cmake --build build/windows/x64 --config Release --target large_jpeg_scaler_test
      - name: Run native Windows scaler regressions
        run: python tool/ci_gate.py windows-scaler-test ctest --test-dir build/windows/x64 -C Release --output-on-failure -R large_jpeg_scaler_windows
      - name: Windows application
        uses: actions/upload-artifact@v6
        with:
          name: scan-id-windows
          path: |
            build/windows/x64/runner/Release/
            !build/windows/x64/runner/Release/large_jpeg_scaler_test.exe
            !build/windows/x64/runner/Release/large_jpeg_scaler_test.pdb
          if-no-files-found: error
