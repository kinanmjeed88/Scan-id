name: Windows release build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      # Mostmskat/ contains private, local-only evaluation data. Sparse partial
      # checkout keeps those blobs out of the Windows runner too.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/Mostmskat/
            !/local-data/
          sparse-checkout-cone-mode: false
      - name: Assert local-only evaluation data is excluded
        shell: pwsh
        run: |
          if (Test-Path 'Mostmskat') { throw 'Private Mostmskat data must stay out of CI.' }
          if (Test-Path 'local-data') { throw 'Private local-data must stay out of CI.' }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      # Same pinned asset as the other jobs: 83 MB, git-ignored, keyed by its
      # SHA-256 so a restored copy is re-hashed rather than trusted. Run
      # 41213748658 failed here on an upstream outage while the pull-request
      # run of the same commit passed, so the retry budget is shared too.
      - name: Restore the pinned DocAligner asset
        id: docaligner-cache
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: assets/models/docaligner_fastvit_sa24_7f9f5a89.onnx
          key: docaligner-1.1.1-7f9f5a8935b2eb22b3ee0245d34996063f54562df390d34714af2d76928695bc
      # The OCR graphs are 12.8 MiB of Apache-2.0 weights, git-ignored and
      # fetched from their pinned upstream revisions. The fetch verifies the byte
      # size and SHA-256 before the files are used, so a substituted or truncated
      # model cannot reach a build; a restored cache entry is re-hashed rather
      # than trusted.
      - name: Restore the pinned PP-OCRv5 models
        id: ocr-models-cache
        continue-on-error: true
        uses: actions/cache@v6
        with:
          path: |
            assets/models/ppocrv5_mobile_det.onnx
            assets/models/ppocrv5_arabic_mobile_rec.onnx
          key: ocr-models-ppocrv5-a431985659dc921974177a95adcfbb90fd9e51989a5e04d70d0b75f597b6e61d-799113ebf267fbe742deb99eb36e8d42c9ddc5291ceacf92add41b4d52a59110

      - name: Prepare verified PP-OCRv5 models
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            echo "Preparing pinned PP-OCRv5 models (attempt $attempt/4)"
            if python tool/fetch_ocr_models.py; then
              exit 0
            fi
            if (( attempt < 4 )); then
              sleep $((attempt * 10))
            fi
          done
          exit 1
      - name: Prepare verified DocAligner 1.1.1 model asset
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            echo "Preparing pinned DocAligner asset (attempt $attempt/4)"
            if python tool/fetch_docaligner_model.py; then
              exit 0
            fi
            if (( attempt < 4 )); then
              sleep $((attempt * 10))
            fi
          done
          exit 1
      - name: Resolve dependencies
        shell: bash
        run: python tool/ci_gate.py bootstrap bash tool/bootstrap.sh
      - name: Build Windows release
        run: python tool/ci_gate.py windows-build flutter build windows --release
      - name: Build native Windows scaler regression tests
        run: python tool/ci_gate.py windows-scaler-build cmake --build build/windows/x64 --config Release --target large_jpeg_scaler_test
      - name: Run native Windows scaler regressions
        run: python tool/ci_gate.py windows-scaler-test ctest --test-dir build/windows/x64 -C Release --output-on-failure -R large_jpeg_scaler_windows
      - name: Run bundled DocQuad ONNX Runtime inference on Windows
        run: python tool/ci_gate.py docquad-windows flutter test integration_test/docquad_inference_test.dart -d windows --reporter expanded
      # Real inference of both OCR graphs on the host platform: detection,
      # tensor layout, dictionary mapping and CTC decoding are exercised against
      # platform-rendered Latin/Arabic pages, not mocked.
      - name: Run bundled PP-OCRv5 inference on Windows
        run: python tool/ci_gate.py ocr-windows flutter test integration_test/ocr_inference_test.dart -d windows --reporter expanded
      - name: Create Windows portable ZIP
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          $zip = "scan-id-windows.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          # Exclude test binaries if they still exist
          Get-ChildItem $src -Recurse | Out-Null
          Compress-Archive -Path "$src/*" -DestinationPath $zip -Force
          $size = (Get-Item $zip).Length
          Write-Host "Created $zip ($size bytes)"
          if ($size -eq 0) { throw "Windows ZIP is empty" }
      - name: Windows application
        uses: actions/upload-artifact@v6
        with:
          name: scan-id-windows
          path: |
            build/windows/x64/runner/Release/
            !build/windows/x64/runner/Release/large_jpeg_scaler_test.exe
            !build/windows/x64/runner/Release/large_jpeg_scaler_test.pdb
          retention-days: 14
          if-no-files-found: error
      - name: Windows portable ZIP
        uses: actions/upload-artifact@v6
        with:
          name: scan-id-windows-zip
          path: scan-id-windows.zip
          if-no-files-found: error
          retention-days: 14
